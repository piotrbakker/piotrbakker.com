    subtitle: "Owning the complete design process"

  - icon: "ph-duotone ph-unite"
    title: "Cross-Functional Collaboration"
    subtitle: "Bridging design and development"

  - icon: "ph-duotone ph-devices"
    title: "Multi-Platform Design"
    subtitle: "Designing for all user touchpoints"

  - icon: "ph-duotone ph-tree-structure"
    title: "Systems Thinking"
    subtitle: "Building for speed and scale"
