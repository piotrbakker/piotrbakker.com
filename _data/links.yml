# Writing
articles:
  - title: "User Interfaces Are Not Jigsaw Puzzles"
    url: "https://piotrbakker.medium.com/744b70a8db5b"
    description: "Designing user interfaces is more like solving a Rubik’s Cube than a jigsaw puzzle."
    quote: "I used to think that designing user interfaces is like completing a jigsaw puzzle: you start off with a bunch of disconnected ideas and try out various ways of putting them together until everything fits in place. It’s actually more complicated than that."

  - title: "Pitching a New Design? Show Them How You Got There."
    url: "https://piotrbakker.medium.com/415b43f35ffc"
    description: "The one thing that matters more than your new design is how you came up with it."
    quote: "You’ve just finished working on a new design and you are about to pitch it to your team. You’ve been at it for days, obsessing about the tiniest details, getting stuck along the way and wanting to give up on it more often than you’d ever admit. Now that you’ve prevailed, though, you are bursting with excitement. You can’t wait to show it to everyone. My advice: don’t do it. Not quite yet, anyway."

  - title: "DIY Tips for User Interface Design"
    url: "https://piotrbakker.medium.com/d8242357458"
    description: "Color, typography, and layout pointers for indie makers."
    quote: "A well designed user interface makes a difference. Not only does it make your product look good, it helps people actually use it too. That being said, you don’t always have the luxury to collaborate with a professional designer on your app or website. Finding the right person for the job can take weeks or months even, if you are lucky. And that’s assuming you have the budget to begin with. But you don’t necessarily need to lean on a designer in the first place."

  - title: "What Makes For a Great Conversation With a Bot?"
    url: "https://piotrbakker.medium.com/43706050b62d"
    description: "How to design chatbots that people enjoy talking&nbsp;to."
    quote: "Conversational interfaces have nothing of the glamour of their graphical counterparts. There are no gradients, no strokes, no shadows or rounded corners. For the most part, not even custom fonts. So for someone who’s used to sweating over hex codes and sub-pixels, a conversational interface can seem like the ultimate anticlimax. You know, what’s there to design? Well, as it turns out, a lot."

  - title: "Designing MVPs: Where Do You Start?"
    url: "https://piotrbakker.medium.com/930b0fb969b8"
    description: "If I had to give one piece of advice about designing MVPs this would be&nbsp;it."
    quote: "You got out of the building. You talked to your prospective customers. Finally, you’ve built and field tested your first prototype. It’s a little clunky and rough around the edges but it did its job: you now have a decent idea of what people in your target market care about. It’s time to design your product’s next iteration, the minimum viable product (MVP). Where do you start?"

  - title: "Trial and Error in Design"
    url: "https://piotrbakker.medium.com/29efe9853dcf"
    description: "Don’t settle for the first idea that’s good enough. Keep exploring."
    quote: "When I discuss a new project with a prospective client I often get asked about my workflow. It’s an easy question to answer. Over the years I’ve developed a relatively simple system that does the job well (more on that another time). What is a bit more difficult to explain, though, is an essential part of this workflow: trial and error."

  - title: "Pixelmator Pro vs. Invision Studio: The Tale of Two Product Launches"
    url: "https://piotrbakker.medium.com/9e2a91a3f041"
    description: "Two underdogs of the digital design industry are getting ready for take&#8209;off."
    quote: "I’m salivating at the thought of taking Invision Studio and Pixelmator Pro for a spin. In no small part is that due to the superbly attired launch websites the new apps are coming with. They seduce you. They tease you. They leave you craving for more. But they also reveal two very different approaches to launching new products."

  - title: "Should Machines Speak Like Us?"
    url: "https://piotrbakker.medium.com/eb0000d242f3"
    description: "Machines are getting smarter, but it doesn’t mean they should also sound more human."
    quote: "Nearly every device, from the fridge in your kitchen to the car that takes you to work, is getting a voice interaction makeover. Driven by recent advances in A.I., machines we can talk to, machines that speak like human beings, are finally becoming a reality. It makes sense. Using voice to interact with machines seems like the obvious next step for human-computer interaction. And to design these interactions to closely mimic human conversations its natural conclusion. That’s easier said than done, though."

  - title: "Take Your Time With Creativity"
    url: "https://piotrbakker.medium.com/8cb1e4cb0b5"
    description: "Original ideas take more time, not&nbsp;less."
    quote: "Les Demoiselles d’Avignon is a groundbreaking work of young Pablo Picasso that he completed more than a century ago, in 1907. This period in Picasso’s life, who was only 25 years old at the time, is often described as spontaneous and intuitive. But despite the rough and seemingly improvised appearance of Les Demoiselles, the painting has not been conceived in a sudden jolt of inspiration."
