{% comment %}
Image Modal Include
- id: unique identifier for the modal
- src: image source path
- alt: image alt text
{% endcomment %}

<div class="modal fade container-bg-blurred" id="{{ include.id }}" tabindex="-1" aria-labelledby="{{ include.id }}-label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content border-0 rounded-5 container-bg-primary">
      <div class="modal-header border-0">
        <button type="button" class="rounded-circle border-0 ms-auto d-flex-center btn-size-md btn-hover btn-bg-monochrome btn-label-monochrome" data-bs-dismiss="modal" aria-label="Close">
          <i class="ph-bold ph-x"></i>
        </button>
      </div>
      <div class="modal-body p-4 d-flex justify-content-center">
        <img class="img-fluid" style="max-height: 75vh; width: auto;" alt="{{ include.alt }}" src="{{ include.src }}">
      </div>
    </div>
  </div>
</div>
